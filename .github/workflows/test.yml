name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check (browser JS)
        run: for f in assets/*.js; do node --check "$f"; done

      - name: Unit tests (Node, 含 XSS 回归)
        run: node --test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (Python, RSS 合并)
        run: python -m unittest discover -s tests -p "test_*.py" -v
